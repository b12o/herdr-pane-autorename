id = "herdr-pane-autorename"
name = "Herdr Pane Autorename"
description = "Labels panes with the name of the current running foreground process."
version = "0.1.0"
min_herdr_version = "0.8.0"
platforms = ["linux", "macos"]

[[startup]]
command = ["bash", "herdr-pane-autorename.sh"]

[[actions]]
id = "stop"
title = "Stop the autorename watcher script"
command = ["pkill", "-f", "herdr-pane-autorename.sh"]

[[actions]]
id = "resume"
title = "Start/resume the autorename watcher script"
command = ["bash", "herdr-pane-autorename.sh"]
